<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo do Número Secreto</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Jogo do Número Secreto</h1>
    <p class="subtitulo">Estou pensando em um número entre 1 e 100. Consegue adivinhar?</p>

    <div class="entrada">
      <input type="number" id="palpite" min="1" max="100" placeholder="Seu palpite" autofocus>
      <button id="btn-chutar" type="button">Chutar</button>
    </div>

    <p id="mensagem" class="mensagem" aria-live="polite">Digite um número e clique em "Chutar".</p>
    <p id="tentativas" class="tentativas"></p>

    <button id="btn-reiniciar" type="button" class="oculto">Jogar novamente</button>
  </main>

  <script src="script.js"></script>
</body>
</html>
